<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Arma tu arroz con leche Mimi Cream y envíanos tu pedido por WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:title" content="Mimi Cream - Tu arrocito con leche">
<meta property="og:description" content="Arma tu arroz con leche a tu gusto y envíanos el pedido por WhatsApp 💜">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍚%3C/text%3E%3C/svg%3E">
<title>Mimi Cream - Tu arrocito con leche</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600&display=swap">
<style>
:root{--bg:#f6eee4;--sheet:#fffaf3;--ink:#5a2f3d;--mut:#8f7480;--lil:#9680c6;--lil2:#ebe3f7;--lil3:#cdbfe9;--ln:#eee3e3;--tan:#cba99b;--grn:#6f9d75;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 "Nunito",system-ui,sans-serif}
main{position:relative;overflow:hidden;max-width:560px;margin:10px auto;background:var(--sheet);border-radius:30px;box-shadow:0 8px 30px #7a5a6a22;padding:14px 12px 70px}
main>*{position:relative;z-index:1}
main>.bl{position:absolute;z-index:0;background:var(--lil2);pointer-events:none}
.b1{top:-40px;left:-50px;width:210px;height:170px;border-radius:55% 45% 60% 40%}
.b2{top:40px;right:-60px;width:150px;height:130px;border-radius:45% 55% 40% 60%;opacity:.7}
.b3{bottom:-50px;left:-60px;width:210px;height:170px;border-radius:60% 40% 55% 45%}
.b4{bottom:-60px;right:-50px;width:190px;height:150px;border-radius:50% 50% 45% 55%}
.paw{position:absolute!important;z-index:0!important;right:24px;bottom:18px;width:34px;fill:var(--tan);opacity:.75;pointer-events:none}
.hd{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 12px}
.hd img{width:min(230px,62%);height:auto;display:block}
.ht{color:var(--tan);font-size:22px}.hd .ht:last-child{font-size:16px;align-self:flex-end;margin-bottom:12px}
.card{background:#fffdf9;border:1px solid var(--ln);border-radius:24px;padding:14px;margin-bottom:14px;box-shadow:0 4px 14px #7a5a6a14}
h2{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:600 21px "Fredoka",sans-serif;color:var(--ink)}
h2 small{font:500 14px "Fredoka",sans-serif}
.num{width:34px;height:34px;border-radius:50%;background:var(--lil);color:#fff;display:grid;place-items:center;font:600 18px "Fredoka",sans-serif;flex:none}
h2 .ht{margin-left:auto;font-size:20px}
.op{position:relative;display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border:1.5px solid var(--ln);border-radius:18px;margin-bottom:8px;cursor:pointer;background:#fffdfb}
.op.on{background:var(--lil2);border-color:var(--lil3)}
input[type=radio]{position:absolute;opacity:0;pointer-events:none}
.ic{width:52px;height:52px;border-radius:14px;background:#fff3ea;display:grid;place-items:center;font-size:28px;flex:none}
.tx{flex:1;min-width:0}.tx b{display:block;font:600 17px "Fredoka",sans-serif}.tx small{display:block;color:var(--mut);font-size:12.5px;line-height:1.25}
.pr{font:600 17px "Fredoka",sans-serif}
.rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--lil3);flex:none;background:#fff}
.op.on .rd{border-color:var(--lil);background:radial-gradient(circle,var(--lil) 0 45%,#fff 50%)}
.qs{display:flex;gap:8px;margin:2px 0 8px}
.qo{flex:1;display:flex;align-items:center;gap:10px;padding:10px;border:1.5px solid var(--ln);border-radius:18px;cursor:pointer;background:#fffdfb;position:relative}
.qo .qc{width:36px;height:36px;border-radius:50%;background:#fff3ea;display:grid;place-items:center;font-size:19px;flex:none}
.qo.on{background:var(--lil);border-color:var(--lil);color:#fff}.qo.on small{color:#f1eafc}.qo.on .qc{background:#fff}
.este{display:flex;align-items:center;justify-content:space-between;margin:4px 4px 10px}
.hand{font:600 19px/1 "Caveat",cursive;color:var(--ink)}
.big{font:600 28px "Fredoka",sans-serif}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;padding:14px;background:var(--lil);color:#fff;font:600 17px "Fredoka",sans-serif;text-decoration:none;cursor:pointer}
.btn .pl{width:26px;height:26px;border-radius:50%;background:#ffffff40;display:grid;place-items:center;font-size:20px;line-height:1}
.btn.wa{background:var(--grn)}.btn svg{width:26px;height:26px;fill:#fff}
.btn.off{opacity:.45;pointer-events:none}
.ci{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px}
.ci+.ci{border-top:1px solid var(--ln)}
.ci b{font-weight:600;font-size:15.5px}.ci small{display:block;color:var(--mut)}
.box{border:1.5px solid var(--ln);border-radius:18px;margin-bottom:12px}
.q{display:flex;align-items:center;gap:12px;flex:none}
.q button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--lil3);background:#fff;color:var(--lil);font-size:22px;line-height:1;padding:0}
.q span{min-width:14px;text-align:center;font-weight:700}
.emp{padding:12px;color:var(--mut)}
.dl{display:grid;grid-template-columns:29% 1fr;gap:10px;align-items:center;padding:10px;border:1.5px solid var(--ln);border-radius:18px;margin:12px 0}
.tr{display:flex;align-items:center;justify-content:center}.tr svg{width:100%;height:auto;display:block}
.fl{display:flex;flex-direction:column;gap:8px;min-width:0}
input[type=text]{width:100%;border:0;background:none;color:var(--ink);font:700 15px "Nunito",sans-serif;padding:2px 0;outline:none}
input[type=text]::placeholder{color:#b3a0a8;font-weight:600}
.pin{display:flex;align-items:center;gap:8px;background:var(--lil2);border-radius:10px;padding:11px 10px}.pin input{font-weight:600}
.cerca:empty{display:none}.cerca{margin:-4px 0 10px;color:var(--lil);font-weight:800;font-size:13px}
.sum{background:var(--lil2);border-radius:18px;padding:12px}
.rw{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-bottom:2px}
.rw.t{margin:6px 0 10px;font:600 24px "Fredoka",sans-serif}
.falta{margin:8px 0 0;font-size:13px;color:var(--mut);text-align:center}
.gs{filter:grayscale(1);font-style:normal}
</style>
</head>

    <div class="rw"><span>Pedido</span><b id="sub">$0</b></div>
    <div class="rw"><span>Domicilio</span><b id="dom">—</b></div>
    <div class="rw t"><span>Total</span><span id="tot">$0</span></div>
    <a class="btn wa off" id="go" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20z"/><path d="M16.5 14.4c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1-.6.8-.8.9-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.7-1.6c-.2-.4-.4-.4-.5-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.5 1 2.7s1.8 2.8 4.4 3.9c1.6.7 2.3.7 3.1.6.5-.1 1.4-.6 1.6-1.2s.2-1.1.2-1.2-.2-.2-.4-.3z"/></svg>Enviar pedido por WhatsApp</a>
    <p class="falta" id="falta"></p>
  </div>
</section>
</main>
<script>
const NUM="573223279738";
const SAB=[{n:"Normalito",d:"Arroz con leche cremosito y sencillo",e:"🍚",p:10000,full:"Arroz con leche normalito"},{n:"Fresa",d:"Mermelada de fresa con trocitos de fresa",e:"🍓",p:14000,full:"Arroz con leche de fresa"},{n:"Mora",d:"Mermelada de mora con arándanos",e:"🫐",p:14000,full:"Arroz con leche de mora"},{n:"Arequipe",d:"Arroz con leche cremoso con Arequipe y queso",e:"🍮",p:12000,full:"Arroz con leche de arequipe"},{n:"Chocolate",d:"Crema de chocolate, con chantilli, milo y bolitas de chokis.",e:"🍫",p:13000,full:"Arroz con leche de chocolate"},{n:"Canela con uvas pasas",d:"Arroz con leche tradicional",e:"🍇",p:12000,full:"Arroz con leche de canela con uvas pasas"}];
const QUESO=2000;
const cop=n=>"$"+Number(n).toLocaleString("es-CO");
const $=s=>document.querySelector(s);
const CERCA=["portofino","verona","capri","terranova","morelli","puertas del sol"];
const norm=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ");
let sel={f:0,q:false},cart=[];
const precio=()=>SAB[sel.f].p+(sel.q?QUESO:0);
function drawOpts(){
  $("#opts").innerHTML=SAB.map((t,i)=>`<label class="op ${sel.f===i?"on":""}"><input type="radio" name="o" data-i="${i}" ${sel.f===i?"checked":""}><span class="ic">${t.e}</span><span class="tx"><b>${t.n}</b><small>${t.d}</small></span><span class="pr">${cop(t.p)}</span><span class="rd"></span></label>`).join("")+`<div class="qs"><label class="qo ${!sel.q?"on":""}"><input type="radio" name="qs" data-q="0" ${!sel.q?"checked":""}><span class="qc"><i class="gs">🧀</i></span><span class="tx"><b>Sin queso</b></span></label><label class="qo ${sel.q?"on":""}"><input type="radio" name="qs" data-q="1" ${sel.q?"checked":""}><span class="qc">🧀</span><span class="tx"><b>Con queso</b><small>+${cop(QUESO)}</small></span></label></div>`;
  $("#este").textContent=cop(precio());
  document.querySelectorAll("#opts input[data-i]").forEach(c=>c.onchange=()=>{sel.f=+c.dataset.i;drawOpts()});
  document.querySelectorAll("#opts input[data-q]").forEach(c=>c.onchange=()=>{sel.q=c.dataset.q==="1";drawOpts()});
}
function drawCart(){
  $("#cart").innerHTML=cart.length?cart.map((i,k)=>`<div class="ci"><div><b>${i.n}</b><small>${cop(i.p)} c/u</small></div><div class="q"><button data-k="${k}" data-d="-1">−</button><span>${i.q}</span><button data-k="${k}" data-d="1">+</button></div></div>`).join(""):`<div class="emp">Aún no has agregado nada.</div>`;
  document.querySelectorAll("#cart button").forEach(b=>b.onclick=()=>{const i=cart[+b.dataset.k];i.q+=+b.dataset.d;if(i.q<1)cart.splice(+b.dataset.k,1);drawCart()});
  upd();
}
$("#add").onclick=()=>{
  const n=SAB[sel.f].full+(sel.q?" con queso":""),p=precio(),e=cart.find(i=>i.n===n);
  if(e)e.q++;else cart.push({n,p,q:1});
  sel={f:0,q:false};drawOpts();drawCart();
};
function upd(){
  const cerca=CERCA.some(w=>norm($("#dir").value).includes(w)),sub=cart.reduce((s,i)=>s+i.p*i.q,0),dom=cart.length?(cerca?2500:8000):0,tot=sub+dom,cli=$("#nom").value.trim(),dir=$("#dir").value.trim();
  $("#sub").textContent=cop(sub);$("#cerca").textContent=cerca?"¡Tu conjunto tiene domicilio especial de "+cop(2500)+"!":"";
  $("#dom").textContent=cart.length?cop(dom):"—";$("#tot").textContent=cop(tot);
  const lines=["🍚 PEDIDO MIMI CREAM","👤 Cliente: "+cli];
  if(dir)lines.push("📍 Dirección: "+dir);
  cart.forEach(i=>lines.push("🍚 "+i.q+"x "+i.n+" - "+cop(i.p*i.q)));
  if(cart.length)lines.push("🛵 Entrega ("+(cerca?"Conjunto cercano":"Domicilio")+") - "+cop(dom));
  lines.push("💰 TOTAL: "+cop(tot));
  $("#go").href="https://api.whatsapp.com/send?phone="+NUM+"&text="+encodeURIComponent(lines.join("\n"));
  const falta=[];if(!cart.length)falta.push("agregar un arroz");if(!cli)falta.push("tu nombre");
  $("#go").classList.toggle("off",falta.length>0);
  $("#falta").textContent=falta.length?"Para enviar falta: "+falta.join(", ")+".":"";
}
$("#nom").oninput=upd;$("#dir").oninput=upd;
drawOpts();drawCart();
</script>
</body>
</html>
